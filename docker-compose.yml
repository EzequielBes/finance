services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-por-uma-segura-em-producao}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: 7
      DATABASE_URL: sqlite+aiosqlite:////data/financeiro.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
